<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title description">
  <title id="title">Regional V3 provider routing across one workflow hierarchy</title>
  <desc id="description">Three persisted Registry DG routes connect Root and Subgraph consumers in both directions and between sibling Subgraphs through their lowest common ancestor. Stable domain and transport identities are distinct. Separate workflows are never searched.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0c121b"/><stop offset="1" stop-color="#111c2a"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#26364c" stroke-opacity=".25"/></pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dy="10" stdDeviation="12" flood-opacity=".35"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0l10 5-10 5z" fill="#a88af4"/></marker>
    <marker id="blocked" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0l10 5-10 5z" fill="#e27887"/></marker>
  </defs>
  <rect width="1600" height="1000" rx="24" fill="url(#bg)"/>
  <rect width="1600" height="1000" rx="24" fill="url(#grid)"/>
  <path d="M0 8Q0 0 8 0h1584q8 0 8 8v5H0z" fill="#4b82dd"/>
  <g font-family="Inter,Segoe UI,sans-serif">
    <text x="62" y="70" fill="#7faaf0" font-size="17" font-weight="700" letter-spacing="3">CORE CONCEPT · 1.3.0 TARGET</text>
    <text x="62" y="122" fill="#f1f6fd" font-size="39" font-weight="750">Provider routing across one workflow hierarchy</text>
    <text x="62" y="158" fill="#9bacc1" font-size="18">Persisted native boundary links carry registered resources between Root and nested graphs.</text>
    <g transform="translate(1280 54)"><rect width="258" height="58" rx="16" fill="#302820" stroke="#9b7440"/><text x="22" y="25" fill="#e8c58f" font-size="13" font-weight="700">1.3.0 IN PREPARATION</text><text x="22" y="44" fill="#bca987" font-size="13">Not yet released</text></g>

    <rect x="52" y="194" width="1110" height="604" rx="22" fill="#101a28" stroke="#49698f" stroke-width="2"/>
    <text x="78" y="228" fill="#b9d5fb" font-size="15" font-weight="700" letter-spacing="1.4">OWNING ROOT WORKFLOW · DISCOVERY AND ROUTING BOUNDARY</text>

    <g filter="url(#shadow)">
      <rect x="82" y="260" width="1050" height="142" rx="16" fill="#162338" stroke="#3e679e"/>
      <text x="106" y="291" fill="#8db8f3" font-size="14" font-weight="700">ROOT → SUBGRAPH</text>
      <rect x="110" y="316" width="154" height="58" rx="11" fill="#2b2146" stroke="#7b61ac"/><text x="133" y="340" fill="#eadfff" font-size="15" font-weight="700">Registry sender</text><text x="133" y="360" fill="#b9aad0" font-size="12">Root</text>
      <path d="M264 345H385" stroke="#a88af4" stroke-width="4" marker-end="url(#arrow)"/>
      <rect x="386" y="316" width="192" height="58" rx="11" fill="#1d304c" stroke="#527fb5"/><text x="412" y="340" fill="#d5e7ff" font-size="14" font-weight="700">DG input boundary</text><text x="412" y="360" fill="#96afd0" font-size="12">persisted typed hop</text>
      <path d="M578 345H708" stroke="#a88af4" stroke-width="4" marker-end="url(#arrow)"/>
      <rect x="710" y="298" width="390" height="88" rx="14" fill="#142a2b" stroke="#3e8d78"/><text x="732" y="324" fill="#8fe0c7" font-size="13" font-weight="700">SUBGRAPH</text><rect x="862" y="331" width="210" height="38" rx="9" fill="#193a35"/><text x="887" y="355" fill="#d4fff3" font-size="14">Registered consumer</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="82" y="424" width="1050" height="142" rx="16" fill="#162338" stroke="#3e679e"/>
      <text x="106" y="455" fill="#8db8f3" font-size="14" font-weight="700">SUBGRAPH → ROOT</text>
      <rect x="110" y="480" width="250" height="62" rx="12" fill="#1d304c" stroke="#527fb5"/><text x="132" y="504" fill="#9fc4f5" font-size="13" font-weight="700">SUBGRAPH</text><text x="232" y="504" fill="#eadfff" font-size="14">Registry sender</text><text x="132" y="526" fill="#96afd0" font-size="12">inner native link</text>
      <path d="M360 511H500" stroke="#a88af4" stroke-width="4" marker-end="url(#arrow)"/>
      <rect x="502" y="480" width="196" height="62" rx="11" fill="#1d304c" stroke="#527fb5"/><text x="526" y="504" fill="#d5e7ff" font-size="14" font-weight="700">DG output boundary</text><text x="526" y="526" fill="#96afd0" font-size="12">persisted typed hop</text>
      <path d="M698 511H840" stroke="#a88af4" stroke-width="4" marker-end="url(#arrow)"/>
      <rect x="842" y="480" width="258" height="62" rx="11" fill="#142a2b" stroke="#3e8d78"/><text x="867" y="506" fill="#d4fff3" font-size="14" font-weight="700">Root consumer</text><text x="867" y="527" fill="#87b9aa" font-size="12">runtime resolution</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="82" y="588" width="1050" height="176" rx="16" fill="#162338" stroke="#3e679e"/>
      <text x="106" y="619" fill="#8db8f3" font-size="14" font-weight="700">SUBGRAPH A → ROOT / LCA → SUBGRAPH B</text>
      <rect x="110" y="643" width="220" height="84" rx="12" fill="#25203d" stroke="#715b9f"/><text x="132" y="670" fill="#cdb9f3" font-size="13" font-weight="700">SUBGRAPH A</text><text x="132" y="698" fill="#f0e8ff" font-size="14">Registry sender</text>
      <path d="M330 685H455" stroke="#a88af4" stroke-width="4" marker-end="url(#arrow)"/>
      <rect x="457" y="643" width="292" height="84" rx="12" fill="#1d304c" stroke="#527fb5"/><text x="482" y="671" fill="#d5e7ff" font-size="14" font-weight="700">Lowest common ancestor</text><text x="482" y="697" fill="#96afd0" font-size="12">A output → Root link → B input</text>
      <path d="M749 685H872" stroke="#a88af4" stroke-width="4" marker-end="url(#arrow)"/>
      <rect x="874" y="643" width="226" height="84" rx="12" fill="#142a2b" stroke="#3e8d78"/><text x="896" y="670" fill="#8fe0c7" font-size="13" font-weight="700">SUBGRAPH B</text><text x="896" y="698" fill="#d4fff3" font-size="14">Registered consumer</text>
      <text x="110" y="750" fill="#788da8" font-size="12">Deeper nesting repeats the same boundary-hop and LCA pattern.</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="1192" y="194" width="346" height="392" rx="20" fill="#141d2a" stroke="#53657b"/>
      <text x="1218" y="229" fill="#dce7f5" font-size="15" font-weight="700" letter-spacing="1.2">IDENTITY LAYERS</text>
      <rect x="1218" y="254" width="294" height="92" rx="12" fill="#183046" stroke="#3e729a"/><text x="1240" y="280" fill="#9dcdf1" font-size="13" font-weight="700">DOMAIN INTENT</text><text x="1240" y="307" fill="#e3f2ff" font-size="14">document_id · region_id</text><text x="1240" y="329" fill="#e3f2ff" font-size="14">collector_id · resource_id</text>
      <rect x="1218" y="365" width="294" height="92" rx="12" fill="#2b2146" stroke="#765aa8"/><text x="1240" y="391" fill="#cdb5f2" font-size="13" font-weight="700">DG TRANSPORT</text><text x="1240" y="418" fill="#f0e8ff" font-size="14">bvDgSenderId</text><text x="1240" y="440" fill="#f0e8ff" font-size="14">receiver + channel selection</text>
      <rect x="1218" y="476" width="294" height="82" rx="12" fill="#15332f" stroke="#3a826f"/><text x="1240" y="502" fill="#8fe0c7" font-size="13" font-weight="700">EXECUTION PROOF</text><text x="1240" y="529" fill="#d4fff3" font-size="14">validated native typed-link chain</text><text x="1240" y="550" fill="#80a99e" font-size="12">missing or ambiguous → fail closed</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="1192" y="610" width="346" height="188" rx="20" fill="#211820" stroke="#714552"/>
      <text x="1218" y="642" fill="#efb7c1" font-size="14" font-weight="700">SEPARATE WORKFLOW</text>
      <rect x="1218" y="665" width="154" height="72" rx="11" fill="#2a2029" stroke="#6e4a55"/><text x="1241" y="694" fill="#caa4ab" font-size="13">Other root</text><text x="1241" y="715" fill="#947a80" font-size="12">not searched</text>
      <path d="M1382 701H1490" stroke="#e27887" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#blocked)"/>
      <path d="M1417 681l24 40M1441 681l-24 40" stroke="#f095a2" stroke-width="4" stroke-linecap="round"/>
      <text x="1218" y="770" fill="#bd929a" font-size="12">No cross-workflow lookup</text>
    </g>

    <rect x="52" y="826" width="1486" height="124" rx="18" fill="#111a26" stroke="#3d5068"/>
    <text x="78" y="858" fill="#88b9ee" font-size="13" font-weight="700">PERSISTED</text>
    <text x="78" y="884" fill="#c7d7e9" font-size="14">BV_REGIONAL JSON capabilities · stable IDs and selections · native links · technical DG boundaries</text>
    <text x="78" y="923" fill="#dc9ca8" font-size="13" font-weight="700">RUNTIME ONLY</text>
    <text x="224" y="923" fill="#c8a7ad" font-size="14">provider objects · LoRA stacks · detectors · LUT payloads · models · images · latents</text>
    <rect x="1110" y="850" width="400" height="76" rx="14" fill="#1b2430" stroke="#53657b"/><text x="1132" y="876" fill="#dce7f5" font-size="13" font-weight="700">SCOPE</text><text x="1132" y="899" fill="#aab9cc" font-size="13">Registered Registry DG families only</text><text x="1132" y="918" fill="#8190a3" font-size="12">Manual and legacy Collectors remain graph-local</text>
  </g>
</svg>
